apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.samevoice.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.samevoice.mobile'
        minSdk 29
        targetSdk 34
        versionCode 15
        versionName '1.1.9'
    }

    signingConfigs {
        release {
            storeFile file('keystore/samevoice-release.jks')
            storePassword 'samevoice2026'
            keyAlias 'samevoice'
            keyPassword 'samevoice2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}


